<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Admin | Portfolio Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="bar">
        <div class="wrap">
            <div class="brand">Portfolio<small>Admin</small></div>
            <a href="../index.html" target="_blank" class="visit">View Website &rarr;</a>
        </div>
    </header>

    <main class="wrap">
        <nav class="tabs" id="tabs"></nav>
        <section id="panel"></section>
    </main>

    <div class="modal" id="modal" hidden>
        <form id="form">
            <h3 id="modal-title"></h3>
            <div id="modal-fields"></div>
            <div class="actions">
                <button type="button" class="btn" id="modal-cancel">Cancel</button>
                <button type="submit" class="btn solid" id="modal-save">Save</button>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://hmdsarozcfjyggzmzerl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BHVlz-YQnX6Ahe4kB4Bj1g_ShT-iBK0';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------- Helpers ----------
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const chips = arr => `<div class="chips">${(arr || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>`;
        const meta = (...parts) => parts.filter(Boolean).map(esc).join(' · ');

        // ---------- Content definitions (one config drives list, form and CRUD) ----------
        // field types: text | email | textarea | tags (comma list) | lines (one per line) | image
        const ENTITIES = {
            projects: {
                tab: 'Projects', single: 'Project', table: 'projects', order: 'created_at', min: '20rem',
                empty: 'ยังไม่มีโปรเจกต์',
                fields: [
                    { key: 'title', label: 'Title', type: 'text', required: true },
                    { key: 'description', label: 'Description', type: 'textarea', required: true },
                    { key: 'tags', label: 'Tags (comma separated)', type: 'tags', required: true, placeholder: 'Flutter, Machine Learning' },
                    { key: 'image_url', label: 'Project Image', type: 'image' }
                ],
                view: p => `
                    ${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : '<div class="ph">No image</div>'}
                    <h3>${esc(p.title)}</h3><p>${esc(p.description)}</p>${chips(p.tags)}`
            },
            skills: {
                tab: 'Skills & Tools', single: 'Skill Category', table: 'skills', order: null, min: '16rem',
                empty: 'ยังไม่มีทักษะ',
                fields: [
                    { key: 'category', alt: 'name', label: 'Category Name', type: 'text', required: true, placeholder: 'Development' },
                    { key: 'items', label: 'Items (comma separated)', type: 'tags', required: true, placeholder: 'PHP, HTML/CSS, React' }
                ],
                view: s => `<div><h3 class="caps">${esc(s.category || s.name)}</h3>${chips(s.items)}</div>`
            },
            experiences: {
                tab: 'Experience', single: 'Experience', table: 'experiences', order: 'created_at', min: '100%',
                empty: 'ยังไม่มีประสบการณ์',
                fields: [
                    { key: 'title', label: 'Position / Title', type: 'text', required: true, placeholder: 'IT Support Intern' },
                    { key: 'company', label: 'Company / Organization', type: 'text', required: true },
                    { key: 'period', label: 'Period', type: 'text', required: true, placeholder: 'Dec 2023 – Feb 2024' },
                    { key: 'details', label: 'Details (one per line)', type: 'lines', required: true, placeholder: 'Resolved hardware issues\nManaged user accounts' }
                ],
                view: e => `
                    <div><h3>${esc(e.title)}</h3><p class="meta">${meta(e.company, e.period)}</p>
                    <ul>${(e.details || []).map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>`
            },
            education: {
                tab: 'Education', single: 'Education', table: 'education', order: 'created_at', min: '100%',
                empty: 'ยังไม่มีข้อมูลการศึกษา',
                fields: [
                    { key: 'degree', label: 'Degree / Major', type: 'text', required: true },
                    { key: 'institution', label: 'Institution / University', type: 'text', required: true },
                    { key: 'period', label: 'Period / Year', type: 'text', required: true, placeholder: '2022 - 2026' },
                    { key: 'description', label: 'Description (optional)', type: 'textarea' }
                ],
                view: d => `
                    <div><h3>${esc(d.degree)}</h3><p class="meta">${meta(d.institution, d.period)}</p>
                    ${d.description ? `<p>${esc(d.description)}</p>` : ''}</div>`
            }
        };

        const PROFILE_FIELDS = [
            { key: 'name', label: 'Full Name', type: 'text' },
            { key: 'headline', label: 'Headline / Title', type: 'text' },
            { key: 'email', label: 'Email', type: 'email' },
            { key: 'phone', label: 'Phone', type: 'text' },
            { key: 'github', label: 'GitHub', type: 'text' },
            { key: 'location', label: 'Location', type: 'text' }
        ];

        const state = { tab: 'projects', rows: {}, profile: null, editing: null };

        // ---------- Data ----------
        async function fetchAll({ table, order }) {
            let res = order
                ? await sb.from(table).select('*').order(order, { ascending: false })
                : await sb.from(table).select('*');
            if (res.error && order) res = await sb.from(table).select('*');
            if (res.error) console.error(`Error fetching ${table}:`, res.error.message);
            return res.data || [];
        }

        async function save(table, id, data) {
            const { error } = id
                ? await sb.from(table).update(data).eq('id', id)
                : await sb.from(table).insert([data]);
            if (error) console.error(`Error saving ${table}:`, error.message);
            return !error;
        }

        async function uploadImage(file) {
            const name = `${Date.now()}.${file.name.split('.').pop()}`;
            const { error } = await sb.storage.from('project-images').upload(name, file);
            if (error) { alert('อัปโหลดรูปไม่สำเร็จ: ' + error.message); return null; }
            return sb.storage.from('project-images').getPublicUrl(name).data.publicUrl;
        }

        // ---------- Form fields ----------
        const toInput = (f, v) => Array.isArray(v) ? v.join(f.type === 'lines' ? '\n' : ', ') : (v ?? '');

        function fromInput(f, value) {
            if (f.type === 'tags') return value.split(',').map(s => s.trim()).filter(Boolean);
            if (f.type === 'lines') return value.split('\n').map(s => s.trim()).filter(Boolean);
            return value.trim();
        }

        function fieldHtml(f, value = '', editing = false) {
            const attrs = `name="${f.key}" ${f.required ? 'required' : ''} placeholder="${esc(f.placeholder || '')}"`;
            let input;
            if (f.type === 'textarea' || f.type === 'lines') input = `<textarea ${attrs} rows="3">${esc(value)}</textarea>`;
            else if (f.type === 'image') input = `<input type="file" name="${f.key}" accept="image/*">${editing ? '<small>Leave empty to keep the current image.</small>' : ''}`;
            else input = `<input type="${f.type === 'email' ? 'email' : 'text'}" ${attrs} value="${esc(value)}">`;
            return `<label class="field"><span>${f.label}</span>${input}</label>`;
        }

        // ---------- Rendering ----------
        function renderTabs() {
            const tabs = [...Object.entries(ENTITIES).map(([k, E]) => [k, E.tab]), ['profile', 'Profile & Contact']];
            $('tabs').innerHTML = tabs.map(([k, label], i) =>
                `<button data-tab="${k}" class="${k === state.tab ? 'on' : ''}"><i>0${i + 1}</i>${label}</button>`).join('');
        }

        function renderPanel() {
            const name = state.tab;
            if (name === 'profile') {
                $('panel').innerHTML = `
                    <form id="profile-form" class="form-card">
                        <span class="eyebrow">Personal details</span>
                        <h2>Profile &amp; Contact</h2>
                        ${PROFILE_FIELDS.map(f => fieldHtml(f, state.profile?.[f.key])).join('')}
                        <button type="submit" class="btn solid">Save Changes</button>
                    </form>`;
                return;
            }
            const E = ENTITIES[name];
            const rows = state.rows[name] || [];
            $('panel').innerHTML = `
                <div class="panel-head">
                    <div>
                        <span class="eyebrow">${String(rows.length).padStart(2, '0')} ${rows.length === 1 ? 'entry' : 'entries'}</span>
                        <h2>${E.tab}</h2>
                    </div>
                    <button class="btn" data-act="add">+ Add ${E.single}</button>
                </div>
                <div class="list" style="--min:${E.min}">
                    ${rows.map(r => `
                        <article class="item">
                            ${E.view(r)}
                            <footer>
                                <button data-act="edit" data-id="${esc(r.id)}">Edit</button>
                                <button class="danger" data-act="del" data-id="${esc(r.id)}">Delete</button>
                            </footer>
                        </article>`).join('') || `<p class="empty">${E.empty}</p>`}
                </div>`;
        }

        async function reload(name) {
            state.rows[name] = await fetchAll(ENTITIES[name]);
            if (state.tab === name) renderPanel();
        }

        async function show(name) {
            state.tab = name;
            renderTabs();
            if (name === 'profile' && !state.profile) {
                const { data } = await sb.from('profile').select('*').eq('id', 1).single();
                state.profile = data || {};
            } else if (name !== 'profile' && !state.rows[name]) {
                await reload(name);
            }
            if (state.tab === name) renderPanel();
        }

        // ---------- Modal (add / edit) ----------
        function openForm(name, id) {
            const E = ENTITIES[name];
            const row = id ? state.rows[name].find(r => String(r.id) === String(id)) : null;
            state.editing = { name, id: row?.id ?? null };
            $('modal-title').textContent = `${row ? 'Edit' : 'Add'} ${E.single}`;
            $('modal-fields').innerHTML = E.fields.map(f =>
                fieldHtml(f, toInput(f, row?.[f.key] ?? (f.alt && row?.[f.alt])), !!row)).join('');
            $('modal').hidden = false;
        }

        const closeModal = () => { $('modal').hidden = true; };

        async function submitForm(e) {
            e.preventDefault();
            const { name, id } = state.editing;
            const E = ENTITIES[name];
            const btn = $('modal-save');
            btn.disabled = true;

            const data = {};
            for (const f of E.fields) {
                const el = e.target.elements[f.key];
                if (f.type !== 'image') { data[f.key] = fromInput(f, el.value); continue; }
                if (!el.files[0]) continue; // no new file → keep existing image
                const url = await uploadImage(el.files[0]);
                if (!url) { btn.disabled = false; return; }
                data[f.key] = url;
            }

            const ok = await save(E.table, id, data);
            btn.disabled = false;
            if (!ok) return alert('บันทึกข้อมูลไม่สำเร็จ');
            closeModal();
            reload(name);
        }

        async function remove(name, id) {
            if (!confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) return;
            const { error } = await sb.from(ENTITIES[name].table).delete().eq('id', id);
            if (error) { console.error(error.message); return alert('ลบข้อมูลไม่สำเร็จ'); }
            reload(name);
        }

        async function saveProfile(form) {
            const data = Object.fromEntries(PROFILE_FIELDS.map(f => [f.key, form.elements[f.key].value.trim()]));
            const { error } = await sb.from('profile').update(data).eq('id', 1);
            if (error) { console.error(error.message); return alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล'); }
            state.profile = { ...state.profile, ...data };
            alert('บันทึกข้อมูลส่วนตัวเรียบร้อยแล้ว!');
        }

        // ---------- Events ----------
        $('tabs').addEventListener('click', e => {
            const b = e.target.closest('[data-tab]');
            if (b) show(b.dataset.tab);
        });

        $('panel').addEventListener('click', e => {
            const b = e.target.closest('[data-act]');
            if (!b) return;
            const { act, id } = b.dataset;
            if (act === 'add') openForm(state.tab);
            else if (act === 'edit') openForm(state.tab, id);
            else if (act === 'del') remove(state.tab, id);
        });

        $('panel').addEventListener('submit', e => {
            e.preventDefault();
            if (e.target.id === 'profile-form') saveProfile(e.target);
        });

        $('form').addEventListener('submit', submitForm);
        $('modal-cancel').addEventListener('click', closeModal);
        $('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
        addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        show('projects');
    </script>
</body>
</html>
