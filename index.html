<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of Thanasan Thongsri">
    <title>Thanasan Thongsri | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>document.documentElement.classList.add('js')</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="nav">
        <div class="wrap">
            <a href="#home" class="brand">Portfolio<i>.</i></a>
            <nav>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
            </nav>
        </div>
    </header>

    <!-- Home -->
    <section id="home" class="hero">
        <div class="hero-inner">
            <span class="eyebrow">Portfolio</span>
            <h1 id="ui-name">&nbsp;</h1>
            <p id="ui-headline"></p>
            <a href="#projects" class="btn">View Projects</a>
        </div>
        <span class="cue"></span>
    </section>

    <!-- About -->
    <section id="about" class="section">
        <div class="wrap">
            <div class="sec-head reveal">
                <small>01 — Profile</small>
                <h2>About Me</h2>
            </div>

            <div class="about">
                <div>
                    <div class="group reveal">
                        <h3 class="sub">Work Experience</h3>
                        <div id="experiences"><p class="empty">กำลังโหลดข้อมูล...</p></div>
                    </div>
                    <div class="group reveal">
                        <h3 class="sub">Education</h3>
                        <div id="education"><p class="empty">กำลังโหลดข้อมูล...</p></div>
                    </div>
                </div>

                <div>
                    <div class="panel reveal">
                        <h3 class="sub">Contact</h3>
                        <dl class="kv">
                            <dt>Email</dt><dd><a id="ui-email"></a></dd>
                            <dt>Phone</dt><dd><a id="ui-phone"></a></dd>
                            <dt>GitHub</dt><dd><a id="ui-github" target="_blank" rel="noopener"></a></dd>
                            <dt>Location</dt><dd id="ui-location">—</dd>
                        </dl>
                    </div>
                    <div class="panel reveal">
                        <h3 class="sub">Skills &amp; Tools</h3>
                        <div id="skills"><p class="empty">กำลังโหลดข้อมูล...</p></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Projects -->
    <section id="projects" class="section alt">
        <div class="wrap">
            <div class="sec-head reveal">
                <small>02 — Selected Work</small>
                <h2>Featured Projects</h2>
            </div>
            <div id="projects-list" class="projects"></div>
        </div>
    </section>

    <!-- Image popup (hover preview / full viewer) -->
    <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Project preview">
        <button class="lb-x" aria-label="Close" onclick="lbClose()">&times;</button>
        <button class="lb-nav prev" data-d="-1" aria-label="Previous image">&#8249;</button>
        <button class="lb-nav next" data-d="1" aria-label="Next image">&#8250;</button>
        <figure class="lb-box">
            <img id="lb-img" alt="">
            <figcaption>
                <span id="lb-count"></span>
                <h3 id="lb-title"></h3>
                <p id="lb-desc"></p>
            </figcaption>
        </figure>
    </div>

    <footer class="foot">© <span id="year"></span> <span id="foot-name"></span></footer>

    <script src="supabase.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const render = (id, rows, tpl, msg) => {
            $(id).innerHTML = rows.length ? rows.map(tpl).join('') : `<p class="empty">${msg}</p>`;
        };
        const meta = (...parts) => parts.filter(Boolean).map(esc).join(' · ');

        // ---------- Templates ----------
        const tpl = {
            skill: s => `
                <div class="skill">
                    <p>${esc(s.category || s.name)}</p>
                    <div>${(s.items || []).map(i => `<span class="pill">${esc(i)}</span>`).join('')}</div>
                </div>`,

            experience: e => `
                <article class="entry">
                    <h4>${esc(e.title)}</h4>
                    <p class="meta">${meta(e.company, e.period)}</p>
                    ${e.details?.length ? `<ul>${e.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}
                </article>`,

            education: d => `
                <article class="entry">
                    <h4>${esc(d.degree)}</h4>
                    <p class="meta">${meta(d.institution, d.period)}</p>
                    ${d.description ? `<p>${esc(d.description)}</p>` : ''}
                </article>`,

            project: p => {
                const g = p.images?.length ? p.images : (p.image_url ? [p.image_url] : []);
                return `
                <article class="card reveal">
                    <div class="thumb ${g.length ? '' : 'ph'}">
                        ${g.length ? `<div class="slides">${g.map(u => `<img src="${esc(u)}" alt="${esc(p.title)}" loading="lazy">`).join('')}</div>` : 'No image'}
                        ${g.length > 1 ? `
                        <button class="arrow prev" data-dir="-1" aria-label="Previous image">&#8249;</button>
                        <button class="arrow next" data-dir="1" aria-label="Next image">&#8250;</button>
                        <span class="count">1 / ${g.length}</span>` : ''}
                    </div>
                    <h3>${esc(p.title)}</h3>
                    <p>${esc(p.description)}</p>
                    <div class="tags">${(p.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
                </article>`;
            }
        };

        // ---------- Profile ----------
        function renderProfile(p) {
            if (!p) return;
            const link = (id, text, href) => {
                $(id).textContent = text || '—';
                if (text) $(id).href = href;
            };
            $('ui-name').textContent = p.name || '';
            $('ui-headline').textContent = p.headline || '';
            $('ui-location').textContent = p.location || '—';
            $('foot-name').textContent = p.name || '';
            link('ui-email', p.email, `mailto:${p.email}`);
            link('ui-phone', p.phone, `tel:${p.phone}`);
            link('ui-github', p.github, /^https?:/.test(p.github) ? p.github : `https://${p.github}`);
            if (p.name) document.title = `${p.name} | Portfolio`;
        }

        // ---------- Motion ----------
        const io = new IntersectionObserver(entries => entries.forEach(e => {
            if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
        }), { threshold: .12 });
        const observe = () => document.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));

        const nav = document.querySelector('.nav');
        const onScroll = () => nav.classList.toggle('solid', scrollY > 40);
        addEventListener('scroll', onScroll, { passive: true });

        // ---------- Project image carousel ----------
        const list = $('projects-list');
        const slideIndex = s => Math.round(s.scrollLeft / s.clientWidth);

        // ---------- Popup viewer: hover = พรีวิวขยาย, คลิก = เปิดเต็ม (เลื่อนดูทุกรูปได้) ----------
        const lb = $('lb');
        let cur = null, timer;

        function lbSet(i) {
            cur.i = (i + cur.urls.length) % cur.urls.length;
            $('lb-img').src = cur.urls[cur.i];
            $('lb-count').textContent = cur.urls.length > 1 ? `${cur.i + 1} / ${cur.urls.length}` : '';
        }

        function lbOpen(card, mode) {
            const slides = card.querySelector('.slides');
            cur = { slides, urls: [...slides.children].map(img => img.src), i: 0 };
            $('lb-title').textContent = card.querySelector('h3').textContent;
            $('lb-desc').textContent = card.querySelector('p').textContent;
            lb.classList.toggle('multi', cur.urls.length > 1);
            lb.classList.remove('peek', 'open');
            lb.classList.add('on', mode);
            document.body.style.overflow = mode === 'open' ? 'hidden' : '';
            lbSet(slideIndex(slides));
        }

        function lbClose() {
            lb.classList.remove('on', 'peek', 'open');
            document.body.style.overflow = '';
            cur = null;
        }

        const canHover = matchMedia('(hover: hover)').matches;

        list.addEventListener('mouseover', e => {
            const t = e.target.closest('.thumb:not(.ph)');
            if (!canHover || !t || t.contains(e.relatedTarget) || lb.classList.contains('open')) return;
            clearTimeout(timer);
            timer = setTimeout(() => lbOpen(t.closest('.card'), 'peek'), 180);
        });

        list.addEventListener('mouseout', e => {
            const t = e.target.closest('.thumb');
            if (!t || t.contains(e.relatedTarget)) return;
            clearTimeout(timer);
            if (lb.classList.contains('peek')) lbClose();
        });

        list.addEventListener('click', e => {
            const b = e.target.closest('.arrow');
            if (b) {
                const s = b.parentElement.querySelector('.slides');
                s.scrollBy({ left: s.clientWidth * b.dataset.dir, behavior: 'smooth' });
                return;
            }
            const t = e.target.closest('.thumb:not(.ph)');
            if (t) { clearTimeout(timer); lbOpen(t.closest('.card'), 'open'); }
        });

        list.addEventListener('scroll', e => {
            const s = e.target;
            if (!s.classList?.contains('slides')) return;
            const i = slideIndex(s);
            s.parentElement.querySelector('.count').textContent = `${i + 1} / ${s.children.length}`;
            if (cur?.slides === s && lb.classList.contains('peek')) lbSet(i); // พรีวิวตามสไลด์ที่เลื่อน
        }, true);

        lb.addEventListener('click', e => {
            if (!lb.classList.contains('open')) return;
            const n = e.target.closest('.lb-nav');
            if (n) lbSet(cur.i + +n.dataset.d);
            else if (!e.target.closest('.lb-box')) lbClose();
        });

        addEventListener('keydown', e => {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape') lbClose();
            else if (e.key === 'ArrowLeft') lbSet(cur.i - 1);
            else if (e.key === 'ArrowRight') lbSet(cur.i + 1);
        });

        // ---------- Boot ----------
        (async () => {
            $('year').textContent = new Date().getFullYear();
            onScroll();
            observe();
            try {
                const [profile, skills, exps, edus, projects] = await Promise.all([
                    fetchProfile(),
                    fetchAll('skills', null),
                    fetchAll('experiences'),
                    fetchAll('education'),
                    fetchAll('projects')
                ]);
                renderProfile(profile);
                render('skills', skills, tpl.skill, 'ยังไม่มีข้อมูลทักษะ');
                render('experiences', exps, tpl.experience, 'ยังไม่มีข้อมูลประสบการณ์');
                render('education', edus, tpl.education, 'ยังไม่มีข้อมูลการศึกษา');
                render('projects-list', projects, tpl.project, 'ยังไม่มีโปรเจกต์ในระบบ');
                observe();
            } catch (err) {
                console.error('Error loading data:', err);
            }
        })();
    </script>
</body>
</html>
